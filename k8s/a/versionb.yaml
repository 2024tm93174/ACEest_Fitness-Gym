apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-b
  labels:
    app: aceest
    variant: b
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      variant: b
  template:
    metadata:
      labels:
        app: aceest
        variant: b
    spec:
      containers:
      - name: aceest-app
        image: yourusername/aceestfitnessgym:1.1.0
        ports:
        - containerPort: 5000
