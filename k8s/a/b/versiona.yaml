apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-a
  labels:
    app: aceest
    variant: a
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aceest
      variant: a
  template:
    metadata:
      labels:
        app: aceest
        variant: a
    spec:
      containers:
      - name: aceest-app
        image: yourusername/aceestfitnessgym:1.0.0
        ports:
        - containerPort: 5000
