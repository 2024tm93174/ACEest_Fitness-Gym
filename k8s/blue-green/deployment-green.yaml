apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-green
  labels:
    app: aceest
    version: green
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: aceest
      version: green
  template:
    metadata:
      labels:
        app: aceest
        version: green
    spec:
      containers:
      - name: aceest-app
        image: yourusername/aceestfitnessgym:1.3.0
        ports:
        - containerPort: 5000
