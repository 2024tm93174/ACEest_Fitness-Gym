apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  labels:
    app: aceest
    version: blue
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: aceest
      version: blue
  template:
    metadata:
      labels:
        app: aceest
        version: blue
    spec:
      containers:
      - name: aceest-app
        image: yourusername/aceestfitnessgym:1.2.0
        ports:
        - containerPort: 5000
